[project]
name = "money-tools"
version = "0.1.0"
description = "US retirement money calculators. Every number cited to a public source."
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5", "fastapi>=0.115", "uvicorn>=0.32", "mcp>=2.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
